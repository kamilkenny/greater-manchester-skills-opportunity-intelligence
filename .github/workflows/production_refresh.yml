name: Production refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: gm-skillsflow-production-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Microsoft ODBC Driver 18
        shell: bash
        run: |
          set -euo pipefail

          source /etc/os-release

          curl -sSL \
            "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" \
            -o /tmp/packages-microsoft-prod.deb

          sudo dpkg -i /tmp/packages-microsoft-prod.deb

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            msodbcsql18 \
            unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyodbc>=5.2,<6"

      - name: Login to Fabric tenant
        uses: azure/login@v3
        with:
          client-id: ${{ vars.FABRIC_CLIENT_ID }}
          tenant-id: ${{ vars.FABRIC_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Prime Fabric Warehouse SQL token
        shell: bash
        run: |
          set -euo pipefail

          echo "Acquiring Fabric Warehouse SQL access token early..."

          az account get-access-token \
            --resource https://database.windows.net/ \
            --output none

          echo "Fabric Warehouse SQL token cached successfully."

      - name: Bind Fabric pipelines to automation identity
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE_ID="81e75ca0-f556-48c0-9dea-4851ce7bf916"

          TOKEN="$(
            az account get-access-token \
              --resource https://api.fabric.microsoft.com \
              --query accessToken \
              -o tsv
          )"

          declare -A PIPELINES=(
            [pl_ingest_dfe]="d74cac73-5175-47e6-b3e1-f36bb54e5c3d"
            [pl_ingest_nomis]="9d8cf3d5-3430-4bb0-8814-a8e5cd8ada1f"
            [pl_bronze_to_silver]="e446f1f5-a03c-462e-aada-0dfe5bc21903"
            [pl_silver_model]="9ab81518-0410-4bfc-bf80-ad031df6a5f3"
            [pl_silver_to_gold]="304cee55-294a-4999-9410-b6a0e6c5f809"
          )

          for NAME in \
            pl_ingest_dfe \
            pl_ingest_nomis \
            pl_bronze_to_silver \
            pl_silver_model \
            pl_silver_to_gold
          do
            ID="${PIPELINES[$NAME]}"

            echo "Binding ${NAME} to GitHub automation identity"

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              -X PATCH \
              "https://api.fabric.microsoft.com/v1/workspaces/${WORKSPACE_ID}/dataPipelines/${ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"description\":\"GM SkillsFlow production pipeline managed by GitHub automation: ${NAME}\"}"

            echo
          done

      - name: Run Fabric refresh chain and export Gold
        run: |
          python scripts/run_refresh_chain.py

      - name: Leave Fabric tenant session
        if: always()
        run: |
          az logout || true

      - name: Login to Azure serving tenant
        uses: azure/login@v3
        with:
          client-id: ${{ vars.SERVING_CLIENT_ID }}
          tenant-id: ${{ vars.SERVING_TENANT_ID }}
          subscription-id: ${{ vars.SERVING_SUBSCRIPTION_ID }}

      - name: Publish validated snapshot
        id: publish_snapshot
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$(
            python scripts/publish_public_snapshot.py \
              --account "${{ vars.SERVING_STORAGE_ACCOUNT }}" \
              --container "${{ vars.SERVING_STORAGE_CONTAINER }}" \
              --snapshot-dir data/public/build
          )"

          echo "${OUTPUT}"

          if echo "${OUTPUT}" | grep -q "NO_CHANGE"; then
            echo "No material data change detected."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "New validated snapshot published."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Tell live application to check new snapshot
        if: steps.publish_snapshot.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --retry 5 \
            --retry-delay 5 \
            --max-time 60 \
            -X POST \
            "${{ vars.PUBLIC_APP_URL }}/refresh-data"

      - name: No change detected
        if: steps.publish_snapshot.outputs.changed == 'false'
        shell: bash
        run: |
          echo "NO_CHANGE"
          echo "No new public snapshot was required."
          echo "The currently published dashboard snapshot remains active."

      - name: Verify live health
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --retry 5 \
            --retry-delay 5 \
            --max-time 60 \
            "${{ vars.PUBLIC_APP_URL }}/healthz"
