[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-skillsflow"
version = "0.1.0"
description = "Greater Manchester Skills and Opportunity Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name = "KAMIL RIDWAN KEHINDE"}
]

dependencies = [
    "pandas>=2.2,<4",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

# Microsoft Fabric injects these runtime objects into notebook sessions.
# They are therefore valid in Fabric even though static Python analysis
# cannot resolve them locally.
[tool.ruff.lint.per-file-ignores]
"fabric/notebooks/**/*.py" = ["F821"]
